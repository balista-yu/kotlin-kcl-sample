server:
  port: -1  # メインのWebサーバーを無効化

spring:
  application:
    name: kotlin-kcl-sample-consumer
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${POSTGRES_DATABASE_URL}
    username: ${POSTGRES_DATABASE_USER}
    password: ${POSTGRES_DATABASE_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Tokyo
        format_sql: true
        globally_quoted_identifiers: true #予約済キーワードをエスケープするための構成
        globally_quoted_identifiers_skip_column_definitions: true
  devtools:
    livereload:
      enabled: true

# Actuator & Monitoring設定
management:
  server:
    port: 8081  # 管理用エンドポイント専用ポート
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:local}
  # JVMメトリクスの有効化
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

postgres:
  url: ${POSTGRES_DATABASE_URL}
  username: ${POSTGRES_DATABASE_USER}
  password: ${POSTGRES_DATABASE_PASSWORD}
aws:
  accessKey: ${AWS_ACCESS_KEY}
  secretKey: ${AWS_ACCESS_SECRET_KEY}
  region: ${AWS_REGION}
kinesis:
  endpoint: ${AWS_KINESIS_DEV_ENDPOINT}
  animalsStreamName: ${AWS_KINESIS_ANIMALS_STREAM_NAME}
  foodsStreamName: ${AWS_KINESIS_FOODS_STREAM_NAME}
dynamodb:
  endpoint: ${AWS_DYNAMO_DB_DEV_ENDPOINT}
cloudwatch:
  endpoint: ${AWS_CLOUD_WATCH_DEV_ENDPOINT}
